<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0f1420;
      --bg-card: #161d2e;
      --bg-card-hover: #1d2740;
      --text: #e6e9f0;
      --text-muted: #8b97ad;
      --text-heading: #ffffff;
      --accent: #5cc8ff;
      --accent-hover: #86d6ff;
      --accent-ink: #06121c;
      --border: #253149;
      --bg-input: #0b0f18;
      --success: #5bd08b;
      --danger: #ff6b6b;
      --star: #ffd24a;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f3f5f9;
        --bg-card: #ffffff;
        --bg-card-hover: #f0f5ff;
        --text: #1f2633;
        --text-muted: #6b7484;
        --text-heading: #0d1320;
        --accent: #1d7fd6;
        --accent-hover: #1565c0;
        --accent-ink: #ffffff;
        --border: #e1e5ec;
        --bg-input: #f1f3f7;
        --success: #388e3c;
        --danger: #d84343;
        --star: #f6a609;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      padding: 14px;
    }
    .pop-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .pop-header h1 { font-size: 1.05rem; color: var(--text-heading); }
    .pop-header .right { display: flex; align-items: center; gap: 8px; }
    .pop-header .count { font-size: 0.72rem; color: var(--text-muted); }
    .streak-chip {
      display: none; align-items: center; gap: 3px;
      font-size: 0.74rem; font-weight: 700; color: var(--text-heading);
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 999px; padding: 2px 9px;
    }
    .streak-chip.show { display: inline-flex; }

    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin: 10px 0 6px;
    }

    /* Favorites vertical list */
    .fav-list { display: flex; flex-direction: column; gap: 6px; }
    .fav-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      cursor: pointer;
      transition: background 0.12s, transform 0.08s;
    }
    .fav-row:hover { background: var(--bg-card-hover); transform: translateX(2px); }
    .fav-thumb {
      width: 46px; height: 30px; border-radius: 6px; flex-shrink: 0;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: var(--bg-input);
    }
    .fav-thumb img.cover { width: 100%; height: 100%; object-fit: cover; }
    .fav-logo {
      width: 22px; height: 22px; border-radius: 5px;
      object-fit: contain; background: #fff; padding: 2px;
    }
    .fav-logo-fallback {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 700; color: #fff;
    }
    .fav-name {
      font-size: 0.86rem; color: var(--text); font-weight: 500; flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .fav-go { color: var(--text-muted); font-size: 0.9rem; flex-shrink: 0; }
    .fav-empty { font-size: 0.8rem; color: var(--text-muted); padding: 8px 0; }

    /* Quick add */
    .add-row { display: flex; gap: 6px; }
    .add-row input {
      flex: 1; padding: 7px 10px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--bg-input); color: var(--text);
      font-size: 0.82rem; font-family: var(--font); outline: none;
    }
    .add-row input:focus { border-color: var(--accent); }

    .btn {
      padding: 7px 12px; border: none; border-radius: 6px;
      font-size: 0.82rem; cursor: pointer; font-family: var(--font);
      transition: background 0.12s;
    }
    .btn-primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg-card); color: var(--text); }
    .btn-block { width: 100%; }

    .secondary-actions { display: flex; gap: 6px; margin-top: 6px; }
    .secondary-actions .btn { flex: 1; font-size: 0.76rem; padding: 6px; }

    .msg { font-size: 0.75rem; margin-top: 6px; min-height: 1em; }
    .msg.ok { color: var(--success); }
    .msg.err { color: var(--danger); }

    .pop-footer { margin-top: 14px; }
    .open-library {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      background: var(--accent); color: var(--accent-ink); font-weight: 700;
      font-size: 0.88rem; cursor: pointer; font-family: var(--font);
    }
    .open-library:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="pop-header">
    <h1>🎮 Game Hub</h1>
    <div class="right">
      <span class="streak-chip" id="streak-chip" title="Your daily-play streak">🔥 <span id="streak-num">0</span></span>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="section-label">Favorites</div>
  <div class="fav-list" id="fav-grid"></div>

  <div class="section-label">Quick add</div>
  <div class="add-row">
    <input type="text" id="add-url" placeholder="Paste a game URL…" autocomplete="off">
    <button class="btn btn-primary" id="btn-add-url">Add</button>
  </div>
  <div class="secondary-actions">
    <button class="btn btn-ghost" id="btn-add-current">+ Current tab</button>
    <button class="btn btn-ghost" id="btn-upload">↑ Upload .html</button>
    <input type="file" id="file-upload" accept=".html,.htm,text/html" hidden>
  </div>
  <div class="msg" id="msg"></div>

  <div class="pop-footer">
    <button class="open-library" id="btn-open-library">Open Full Library →</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
